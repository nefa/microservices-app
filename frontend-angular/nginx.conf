server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Angular's router handles every real route client-side (see
    # app.routes.ts: /login, /dashboard, /ingest, /chat) - any path
    # nginx doesn't have a matching static file for (a direct load of
    # /chat, or a browser refresh on it) falls back to index.html so
    # Angular's Router can take over and resolve it, instead of nginx
    # returning its own 404 for a route that's real, just not a file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
