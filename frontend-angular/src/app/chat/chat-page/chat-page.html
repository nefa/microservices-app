<app-top-bar />

<div class="chat-page">
  <div class="message-list" #messageList>
    @if (messages().length === 0) {
      <p class="empty-state">
        Ask something like "how many documents do I have?" or "list my recent documents".
      </p>
    }

    @for (message of messages(); track message.id) {
      <app-message-bubble
        [message]="message"
        [class.message-user]="message.role === 'user'"
        [class.message-bot]="message.role === 'bot'"
        [class.message-data]="message.type === 'table' || message.type === 'list'"
      />
    }
  </div>

  <app-chat-input [disabled]="isSending()" (send)="onSend($event)" />
</div>
