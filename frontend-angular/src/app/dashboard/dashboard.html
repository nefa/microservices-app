<app-top-bar />

<div class="dashboard-page">
  <p-card header="Dashboard">
    @if (currentUser(); as user) {
      <p>Welcome, {{ user.email }}.</p>
    }

    <p-button label="Ingest Documents" routerLink="/ingest" />
    <p-button label="Chat" routerLink="/chat" severity="secondary" />
    @if (currentUser()?.role === 'manager') {
      <p-button label="Review Documents" routerLink="/review" severity="help" />
    }
  </p-card>
</div>
