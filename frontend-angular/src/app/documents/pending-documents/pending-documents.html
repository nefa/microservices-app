<p-table [value]="items()" [loading]="isLoading()" styleClass="p-datatable-sm">
  <ng-template #header>
    <tr>
      <th>Filename</th>
      <th>Format</th>
      <th>Submitted by</th>
      <th>Submitted at</th>
      <th></th>
    </tr>
  </ng-template>

  <ng-template #body let-item>
    <tr>
      <td>{{ item.sourceFilename }}</td>
      <td>{{ item.format }}</td>
      <td>{{ item.submittedBy }}</td>
      <td>{{ item.createdAt }}</td>
      <td class="actions">
        @if (rejectingId() === item.id) {
          <input
            pInputText
            size="small"
            placeholder="Reason for rejecting…"
            [ngModel]="rejectReason()"
            (ngModelChange)="rejectReason.set($event)"
          />
          <p-button
            label="Confirm"
            severity="danger"
            size="small"
            [loading]="processingId() === item.id"
            (onClick)="confirmReject(item.id)"
          />
          <p-button label="Cancel" severity="secondary" [text]="true" size="small" (onClick)="cancelReject()" />
        } @else {
          <p-button
            label="Approve"
            severity="success"
            size="small"
            [loading]="processingId() === item.id"
            [disabled]="processingId() !== null"
            (onClick)="approve(item.id)"
          />
          <p-button
            label="Reject"
            severity="danger"
            [text]="true"
            size="small"
            [disabled]="processingId() !== null"
            (onClick)="startReject(item.id)"
          />
        }
      </td>
    </tr>
  </ng-template>

  <ng-template #emptymessage>
    <tr>
      <td colspan="5">No documents awaiting review.</td>
    </tr>
  </ng-template>
</p-table>

@if (errorMessage()) {
  <p-message severity="error">{{ errorMessage() }}</p-message>
}
